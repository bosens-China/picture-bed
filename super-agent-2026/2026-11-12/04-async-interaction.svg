<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="764" viewBox="0 0 1680 764">
<rect x="0" y="0" width="1680" height="764" fill="#ffffff"/>
<style>text{font-family:Arial,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif}</style>
<text x="64" y="78" font-size="43" font-weight="700" fill="#17191e">异步交互：任务还在运行，也能修改指令</text>
<text x="64" y="123" font-size="25" fill="#818891">耗时工具在后台执行，前台可以继续接收消息，并在需要时停止任务</text>
<rect x="64" y="189" width="78" height="42" rx="21" fill="#fff" stroke="#d9dde3" stroke-width="1.5"/>
<text x="103" y="217" text-anchor="middle" font-size="23" fill="#68707a">IM</text>
<text x="214" y="218" font-size="25" font-weight="400" fill="#555b64">用户</text>
<rect x="410" y="174" width="1210" height="77" rx="12" fill="#f5f6f8" stroke="#e0e3e7" stroke-width="1.8" />
<text x="439" y="222" font-size="29" fill="#25282f">帮我运行一下项目的全部测试用例。</text>
<rect x="64" y="282" width="78" height="42" rx="21" fill="#fff" stroke="#d9dde3" stroke-width="1.5"/>
<text x="103" y="310" text-anchor="middle" font-size="23" fill="#68707a">IM</text>
<text x="214" y="311" font-size="25" font-weight="700" fill="#165fbe">Super-agent</text>
<rect x="410" y="267" width="1210" height="77" rx="12" fill="#eef3ff" stroke="#b4c8f0" stroke-width="1.8" />
<text x="439" y="315" font-size="29" fill="#25282f">收到，已在后台启动测试，完成后我会通知你。</text>
<rect x="64" y="375" width="78" height="42" rx="21" fill="#fff" stroke="#d9dde3" stroke-width="1.5"/>
<text x="103" y="403" text-anchor="middle" font-size="23" fill="#68707a">任务</text>
<text x="214" y="404" font-size="25" font-weight="400" fill="#686f79">后台执行</text>
<rect x="410" y="360" width="1210" height="77" rx="12" fill="#fff" stroke="#c7ccd4" stroke-width="1.8" stroke-dasharray="8 5"/>
<text x="439" y="408" font-size="29" fill="#656c75">测试正在运行：已完成 42 / 120 项。</text>
<rect x="64" y="468" width="78" height="42" rx="21" fill="#fff" stroke="#d9dde3" stroke-width="1.5"/>
<text x="103" y="496" text-anchor="middle" font-size="23" fill="#68707a">IM</text>
<text x="214" y="497" font-size="25" font-weight="400" fill="#555b64">用户</text>
<rect x="410" y="453" width="1210" height="77" rx="12" fill="#f5f6f8" stroke="#e0e3e7" stroke-width="1.8" />
<text x="439" y="501" font-size="29" fill="#25282f">先不用跑了，帮我看下最近一次测试失败的原因。</text>
<rect x="64" y="561" width="78" height="42" rx="21" fill="#fff" stroke="#d9dde3" stroke-width="1.5"/>
<text x="103" y="589" text-anchor="middle" font-size="23" fill="#68707a">任务</text>
<text x="214" y="590" font-size="25" font-weight="400" fill="#686f79">后台执行</text>
<rect x="410" y="546" width="1210" height="77" rx="12" fill="#fff" stroke="#c7ccd4" stroke-width="1.8" stroke-dasharray="8 5"/>
<text x="439" y="594" font-size="29" fill="#656c75">已收到停止指令，后台测试已终止。</text>
<rect x="64" y="654" width="78" height="42" rx="21" fill="#fff" stroke="#d9dde3" stroke-width="1.5"/>
<text x="103" y="682" text-anchor="middle" font-size="23" fill="#68707a">IM</text>
<text x="214" y="683" font-size="25" font-weight="700" fill="#165fbe">Super-agent</text>
<rect x="410" y="639" width="1210" height="77" rx="12" fill="#eef3ff" stroke="#b4c8f0" stroke-width="1.8" />
<text x="439" y="687" font-size="29" fill="#25282f">测试已经停止，我正在查看最近一次失败的日志。</text>
</svg>